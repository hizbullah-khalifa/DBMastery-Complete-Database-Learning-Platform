<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DBMastery — Master SQL & MongoDB, One Concept at a Time</title>
    <meta
      name="description"
      content="DBMastery is an interactive learning platform that teaches SQL and MongoDB from beginner fundamentals to advanced database development with clear explanations, real examples, cheatsheets and practice challenges."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DBMastery" />
    <meta property="og:title" content="DBMastery — Master SQL & MongoDB" />
    <meta
      property="og:description"
      content="Learn relational and NoSQL databases through clear explanations, practical examples, commands, cheatsheets, and interactive exploration."
    />
    <meta name="theme-color" content="#070B18" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme before first paint to avoid flashing.
      try {
        var t = localStorage.getItem('dbmastery-theme')
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', t === 'dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
